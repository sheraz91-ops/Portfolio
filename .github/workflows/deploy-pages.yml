name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository contents (debug)
        run: |
          echo "Listing workspace files:"
          ls -la
          echo "Contents of project root:"
          ls -la ./
          echo "Git status:"
          git status --short

      - name: Deploy to gh-pages (JamesIves)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main
          folder: .
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}

